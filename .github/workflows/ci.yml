name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        # Build needs env present; these are non-secret placeholders just so the
        # config loader doesn't throw. Demo mode requires no external services.
        env:
          APP_MODE: demo
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder-anon-key
          BH_API_KEY: ci-placeholder-bh-key
          APP_SECRET: ci-placeholder-app-secret
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_APP_NAME: Slotter
        run: npm run build
