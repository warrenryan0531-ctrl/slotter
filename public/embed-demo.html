<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo: a small business site with the booking widget embedded</title>
  <style>
    body { font-family: Georgia, serif; margin: 0; background: #f7f5f2; color: #222; }
    .hero { background: #14342b; color: #fff; padding: 48px 24px; text-align: center; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Coastal Shine Mobile Detailing</h1>
    <p>Jacksonville's five-star mobile detailing — we come to you.</p>
  </div>
  <div class="wrap">
    <h2>Book online</h2>
    <p>This page simulates a client's EXISTING website (any platform). The widget below is our embed:</p>
    <script src="/widget.js" data-tenant="coastal-shine" async></script>
  </div>
</body>
</html>
